name: addon

on:
  push:
    branches: [main]
    paths: ["cores/wow/addon/**", "mods/wow/**", "scripts/fetch-addons.mjs", "scripts/pinned-tests.sh", "scripts/zip.mjs", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["cores/wow/addon/**", "mods/wow/**", "scripts/fetch-addons.mjs", "scripts/pinned-tests.sh", "scripts/zip.mjs", ".github/workflows/addon.yml"]

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 luarocks
          # Pinned, its dependencies too: the versions CI installed unpinned on 2026-11-09.
          sudo luarocks install argparse 0.7.2-1
          sudo luarocks install luafilesystem 1.9.0-1
          sudo luarocks install luacheck 1.2.0-1
      # Every addon is kept in a repository of its own (the core's pin is cores/wow/addon/pin.json, a
      # mod's mods/wow/<id>/pin.json) and fetched to where its source was, so the checks below read
      # the set the app carries, together: one lint config, one strings pass across core and mods.
      - run: node scripts/fetch-addons.mjs
      # Every addon: the pinned core's and every mod's (Ryna_Chronicle first).
      - run: luacheck cores/wow/addon/ mods/wow/ --config cores/wow/addon/.luacheckrc --no-color
      - name: Every addon file parses as Lua 5.1
        run: |
          shopt -s nullglob
          for f in cores/wow/addon/Ryna_Core/*.lua cores/wow/addon/Ryna_Core/Locales/*.lua mods/wow/*/addon/*/*.lua mods/wow/*/addon/*/Locales/*.lua; do
            luac5.1 -p "$f" || exit 1
          done
      - name: Every translatable string is in its addon's Locales/enUS.lua and the locale templates
        run: node cores/wow/addon/tools/strings.mjs
      # Each mod's own tests (they live in its repository, where they run against the oldest core it
      # supports), cloned at the pinned tag and run here against the core the app carries.
      - name: Every pinned mod's tests, against the pinned core
        run: scripts/pinned-tests.sh
